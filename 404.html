<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة غير موجودة | أكاديمية بلاك هوك</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080909">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@700..800&family=Saira:wdth,wght@100..125,500..800&display=swap">
  <!-- Self-contained on purpose: GitHub Pages serves this file for any missing URL,
       so relative stylesheet paths would break on nested addresses. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background:
        radial-gradient(50% 45% at 50% 38%, rgba(198, 164, 91, 0.16), transparent 70%),
        #080909;
      color: #b7b5ae;
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      line-height: 1.8;
      text-align: center;
    }
    main { display: grid; justify-items: center; gap: 1.1rem; max-width: 34rem; }
    .emblem { width: min(64vw, 280px); height: auto; filter: drop-shadow(0 24px 40px rgba(0,0,0,.8)); animation: rise 1.2s cubic-bezier(.16,1,.3,1) both; }
    .code {
      margin: 0;
      font-family: "Saira", sans-serif;
      font-stretch: 125%;
      font-weight: 800;
      font-size: clamp(4rem, 3rem + 6vw, 7rem);
      line-height: 1;
      letter-spacing: .04em;
      background: linear-gradient(180deg, #f6e5ae, #e7cb86 26%, #c6a45b 56%, #94763a 80%, #dcc07a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 { margin: 0; color: #f5f3ed; font-family: "Noto Kufi Arabic", sans-serif; font-size: clamp(1.4rem, 1.1rem + 1.4vw, 2rem); line-height: 1.5; }
    p { margin: 0; }
    .en { font-family: "Saira", sans-serif; font-size: .78rem; letter-spacing: .24em; text-transform: uppercase; color: #8b8c85; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: .75rem; }
    a {
      display: inline-flex; align-items: center; min-height: 3rem; padding: .8rem 1.5rem;
      border: 1px solid rgba(231, 203, 134, .34); border-radius: 3px;
      color: #f5f3ed; text-decoration: none; font-weight: 600;
      transition: border-color .25s, color .25s, background-color .25s;
    }
    a:hover { border-color: #c6a45b; color: #e7cb86; background: rgba(198,164,91,.08); }
    a.gold { color: #0d0c08; border-color: transparent; background: linear-gradient(120deg, #ecd393, #c6a45b 50%, #a3833f); }
    a.gold:hover { color: #0d0c08; }
    a:focus-visible { outline: 2px solid #e7cb86; outline-offset: 3px; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(1.03); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
    @media (prefers-reduced-motion: reduce) { .emblem { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img class="emblem" data-src="emblem.webp" alt="شعار أكاديمية بلاك هوك" width="780" height="700">
    <p class="code">404</p>
    <h1>الصفحة التي تبحث عنها غير موجودة</h1>
    <p>ربما نُقل الرابط أو كُتب بشكل غير صحيح.</p>
    <p class="en" lang="en">Page not found</p>
    <div class="actions">
      <a class="gold" data-home href="/">العودة إلى الرئيسية</a>
      <a data-home-en href="/en.html" lang="en">Back to home</a>
    </div>
  </main>
  <script>
    // Finds the site's home whether it is served from a custom domain or
    // <user>.github.io (site at "/"), or from <user>.github.io/<repo>/ (site at "/<repo>/").
    (function () {
      var emblem = document.querySelector('.emblem');
      var file = emblem.getAttribute('data-src');
      var first = location.pathname.split('/')[1];
      var candidates = /\.github\.io$/.test(location.hostname) && first ? ['/' + first + '/', '/'] : ['/'];
      function use(base) {
        document.querySelector('[data-home]').href = base;
        document.querySelector('[data-home-en]').href = base + 'en.html';
      }
      (function tryNext(i) {
        use(candidates[i]);
        emblem.onerror = i + 1 < candidates.length ? function () { tryNext(i + 1); } : null;
        emblem.src = candidates[i] + file; // the base where the emblem loads is the site's home
      })(0);
    })();
  </script>
</body>
</html>
